name: Semgrep - nouvelles vulnerabilites

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Detecter les nouvelles vulnerabilites
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.185.0

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Autoriser le repertoire Git dans le conteneur
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Determiner la revision de reference
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE_SHA"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$BASE^{commit}"
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - name: Analyser le code actuel
        shell: bash
        run: semgrep scan --config auto --json --output /tmp/semgrep-apres.json

      - name: Analyser le code de reference
        shell: bash
        run: |
          git worktree add --detach /tmp/tika-semgrep-base "$BASE_SHA"
          cd /tmp/tika-semgrep-base
          semgrep scan --config auto --json --output /tmp/semgrep-avant.json

      - name: Bloquer les nouvelles vulnerabilites
        shell: bash
        run: |
          python3 scripts/compare_semgrep.py \
            /tmp/semgrep-avant.json \
            /tmp/semgrep-apres.json
